<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WOWPadel Score — Live</title>
<link rel="stylesheet" href="./styles.css?v=__DEPLOY_VERSION__" />
</head>
<body>
  <div id="app">
    <div class="state" id="stateLoading">
      <div class="spinner"></div>
      <p>Loading tournament…</p>
    </div>

    <div class="state" id="stateNotFound" hidden>
      <p class="notfound-title">Link not found</p>
      <p class="notfound-body">This event isn't published, or the organizer unpublished it.</p>
    </div>

    <div class="state" id="stateError" hidden>
      <p class="notfound-title">Couldn't load this page</p>
      <p class="notfound-body" id="errorMessage">Unknown error.</p>
      <p class="notfound-body">Try reloading. If it keeps happening, send this message to the organizer.</p>
    </div>

    <div id="content" hidden>
      <header class="header">
        <div class="header-top">
          <a class="icon-btn" id="homeLink" href="https://leonasdv.github.io/wow-padel-score/pwa" aria-label="Open WOWPadel Score home">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11.5 12 4l9 7.5" />
              <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" />
            </svg>
          </a>
          <span class="pill" id="statusPill">LIVE</span>
        </div>
        <h1 id="eventName">—</h1>
        <p class="meta" id="eventMeta">—</p>
      </header>

      <nav class="tabs">
        <button class="tab active" id="tabRoundsBtn">Rounds</button>
        <button class="tab" id="tabStandingsBtn">Standings</button>
      </nav>

      <main>
        <div id="editorBanner" hidden></div>
        <section id="roundsPane"></section>
        <section id="standingsPane" hidden></section>
      </main>

      <footer class="footer">
        <span id="updatedAt"></span> · WOWPadel Score
      </footer>
    </div>
  </div>

  <div class="score-modal-backdrop" id="scoreModalOverlay" hidden>
    <div class="score-modal">
      <p class="score-modal-title" id="scoreModalTitle">Enter score</p>
      <input class="score-modal-input" id="scoreModalInput" type="number" inputmode="numeric" min="0" />
      <p class="score-modal-error" id="scoreModalError" hidden></p>
      <button class="score-modal-clear" id="scoreModalClearBtn" type="button" hidden>Clear score</button>
      <div class="score-modal-actions">
        <button class="score-modal-btn cancel" id="scoreModalCancelBtn" type="button">Cancel</button>
        <button class="score-modal-btn confirm" id="scoreModalConfirmBtn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="./config.js?v=__DEPLOY_VERSION__"></script>
  <script src="./app.js?v=__DEPLOY_VERSION__"></script>
</body>
</html>
